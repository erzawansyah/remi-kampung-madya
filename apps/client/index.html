<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom browser sengaja tidak dikunci (aksesibilitas low-vision). Pinch di meja dicegah
         lewat touch-action: none pada kanvas #game, jadi permainan tidak ikut ter-zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f3d22" />
    <meta name="description" content="Remi aturan Kedai Madya: main online bareng teman, atau offline bareng warga kedai." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/font/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Remi Kampung Madya</title>
    <!-- Splash: tampil selama JS/CSS app dimuat, hilang sendiri begitu #ui terisi. Gayanya di sini (bukan di
         gaya/) supaya langsung tampil sebelum CSS app termuat. Tidak menangkap sentuhan (pointer-events: none). -->
    <style>
      /* Salinan @font-face Baloo 2 dari gaya/dasar.css (harus sama, dijaga logoMadya.test.ts): splash langsung
         memakai font yang di-preload di atas, jadi preload terpakai seketika (tanpa peringatan "preloaded but
         not used") dan judul splash tidak berganti font di tengah jalan. */
      @font-face {
        font-family: 'Baloo 2';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('/font/baloo2-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
          U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        pointer-events: none;
        color: #fbf6e9;
        background: radial-gradient(ellipse 80% 70% at 50% 42%, #15542f 0%, #0c3a20 62%, #072414 100%);
        transition: opacity 260ms ease-out, visibility 0s linear 260ms;
        /* Cadangan kalau skrip di bawah gagal: tetap hilang sendiri. */
        animation: splash-cadangan 0s linear 8s forwards;
      }
      #splash svg {
        width: min(46vw, 190px);
        height: auto;
      }
      #splash p {
        margin: 0;
        font: 700 clamp(1.25rem, 1rem + 1.6vw, 1.75rem) / 1.1 'Baloo 2', ui-rounded, system-ui, sans-serif;
        letter-spacing: 0.01em;
      }
      #ui:not(:empty) ~ #splash,
      #utama:has(#ui:not(:empty)) ~ #splash,
      #splash.selesai {
        opacity: 0;
        visibility: hidden;
      }
      @keyframes splash-cadangan {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>

      <style>
        #splash {
          display: none;
        }
      </style>

        <div>

          <p>Remi Kampung Madya butuh JavaScript buat jalan. Nyalakan dulu di pengaturan browser, terus muat ulang halaman ini ya.</p>
        </div>
      </div>
    </noscript>
    <div id="game"></div>
    <div id="ui"></div>
