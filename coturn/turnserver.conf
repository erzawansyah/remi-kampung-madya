# Server TURN untuk obrolan suara Remi Kampung Madya (0.9.0). Dipakai service `coturn` di
# docker-compose.yml (profil "suara"). Langkah pasang: docs/deploy.md, bagian "Suara dan TURN".
#
# Kredensial memakai skema "REST API" coturn: server Remi membuat username "<kedaluwarsa>:<acak>" dan
# password HMAC-SHA1 dari rahasia bersama. Rahasianya TIDAK ditulis di sini dan tidak pernah jadi argumen
# perintah (terlihat lewat `ps`): coturn/mulai.sh menambahkan static-auth-secret dari env TURN_SECRET ke
# salinan berkas ini yang hanya bisa dibaca coturn. Nilainya sama dengan TURN_SECRET server Remi.
# realm, izin relay ke alamat publik VPS sendiri (TURN_PUBLIC_IP), dan external-ip (TURN_EXTERNAL_IP)
# juga ditambahkan mulai.sh dari env.

listening-port=3478
# Rentang port relay (UDP). Harus sama dengan yang dibuka di firewall VPS.
min-port=49160
max-port=49200

use-auth-secret
fingerprint

# VPS di balik NAT (alamat publik tidak terpasang di kartu jaringannya): isi TURN_EXTERNAL_IP di .env.

# Tanpa TLS (turns:) supaya sederhana; suara WebRTC sudah terenkripsi (DTLS-SRTP) dari ujung ke ujung.
no-tls
no-dtls
no-cli
no-multicast-peers
# Suara WebRTC hanya butuh relay UDP. Relay TCP (RFC 6062) dimatikan supaya TURN tidak bisa dipakai
# sebagai proxy TCP ke mana-mana (SSH, web, dsb.). Pemain tetap boleh menghubungi coturn lewat TCP 3478.
no-tcp-relay
# Relay tidak boleh dipakai untuk menjangkau jaringan privat/lokal VPS. Alamat publik VPS sendiri
# SENGAJA tidak ditolak: kalau dua pemain sama-sama lewat relay, alamat relay lawannya adalah alamat
# VPS ini. mulai.sh malah mengizinkannya tegas (allowed-peer-ip dari TURN_PUBLIC_IP).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Batas supaya satu orang tidak menghabiskan bandwidth VPS (suara ±24 kbps per orang).
user-quota=12
total-quota=120
max-bps=64000
stale-nonce=600

log-file=stdout
simple-log
