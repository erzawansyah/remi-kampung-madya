# Produksi: satu container (server WebSocket + file PWA) di balik reverse proxy HTTPS (mis. Caddy).
#   GIT_SHA=$(git rev-parse --short HEAD) docker compose up -d --build
# Tanpa GIT_SHA, commit tercatat "dev" di /healthz dan layar Tentang.
services:
  remi:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: remi-kampung-madya:latest
    restart: unless-stopped
    ports:
      # Hanya bisa dihubungi dari mesin ini: akses publik lewat reverse proxy HTTPS (PWA wajib HTTPS).
      # Kalau proxy jalan di container lain, hubungkan lewat network Docker dan hapus bagian ports.
      - "127.0.0.1:${REMI_PORT:-2567}:2567"
    environment:
      - PORT=2567
    volumes:
      # Database klasemen akhir (SQLite). Tetap ada walaupun container dibuat ulang.
      - remi-data:/app/data
    # Server menutup WebSocket, meja, dan database dengan rapi saat SIGTERM (biasanya < 1 detik).
    stop_grace_period: 10s
    # Healthcheck ke /healthz sudah ada di Dockerfile.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  remi-data:
