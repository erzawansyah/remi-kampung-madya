# Produksi: satu container (server WebSocket + file PWA) di balik reverse proxy HTTPS (mis. Caddy).
#   GIT_SHA=$(git rev-parse --short HEAD) docker compose up -d --build
# GIT_SHA opsional. Tanpa itu /healthz dan layar Tentang menampilkan hash isi sumber ("h-xxxxxxx")
# sebagai pengganti commit (lihat docs/deploy.md, "Identitas build").
services:
  remi:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: remi-kampung-madya:latest
    restart: unless-stopped
    ports:
      # Hanya bisa dihubungi dari mesin ini: akses publik lewat reverse proxy HTTPS (PWA wajib HTTPS).
      # Kalau proxy jalan di container lain, hubungkan lewat network Docker dan hapus bagian ports.
      - "127.0.0.1:${REMI_PORT:-2567}:2567"
    environment:
      - PORT=2567
      # Usul fitur dari game diteruskan ke database Notion pemilik (docs/deploy.md, "Usul fitur ke
      # Notion"). Isi keduanya di file .env di samping file ini (jangan di-commit). Kosong = usulan
      # cuma disimpan di database, lalu terkirim begitu diisi dan container dibuat ulang.
      - NOTION_TOKEN=${NOTION_TOKEN:-}
      - NOTION_USULAN_DB=${NOTION_USULAN_DB:-}
      # Obrolan suara (docs/deploy.md, "Suara dan TURN"). Kosong = suara hanya pakai STUN (jalan di banyak
      # Wi-Fi, sering gagal di data seluler). TURN_URLS dipisah koma, TURN_SECRET sama dengan rahasia coturn.
      - TURN_URLS=${TURN_URLS:-}
      - TURN_SECRET=${TURN_SECRET:-}
    volumes:
      # Database klasemen akhir (SQLite). Tetap ada walaupun container dibuat ulang.
      - remi-data:/app/data
    # Server menutup WebSocket, meja, dan database dengan rapi saat SIGTERM (biasanya < 1 detik).
    stop_grace_period: 10s
    # Healthcheck ke /healthz sudah ada di Dockerfile.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Server TURN untuk obrolan suara (opsional). Tidak ikut jalan kecuali dinyalakan dengan profil:
  #   docker compose --profile suara up -d
  # Wajib: TURN_SECRET di .env (TURN_REALM opsional), port UDP/TCP 3478 dan UDP 49160-49200 dibuka di
  # firewall VPS. VPS di balik NAT: isi external-ip di coturn/turnserver.conf.
  # Langkah lengkap: docs/deploy.md, "Suara dan TURN".
  coturn:
    image: coturn/coturn:4.6.3
    profiles: ["suara"]
    restart: unless-stopped
    # Jaringan host: rentang port relay tidak perlu dipetakan satu per satu, dan alamat IP asli pemain terlihat.
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      # Sengaja tanpa ":?": compose membaca seluruh berkas walau profil "suara" tidak dipakai, jadi deploy
      # biasa tanpa TURN_SECRET tidak boleh gagal di sini.
      - "--static-auth-secret=${TURN_SECRET:-}"
      - "--realm=${TURN_REALM:-remi-madya}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  remi-data:
